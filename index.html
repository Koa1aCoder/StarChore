<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9ef">
  <title>Little Ladle — A kitchen adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #25352e;
      --muted: #748078;
      --paper: #fff9ef;
      --white: #fffefa;
      --line: #e9e3d8;
      --green: #245c48;
      --green-light: #e9f2e9;
      --tomato: #e7684f;
      --yellow: #f2c65a;
      --shadow: 0 14px 36px rgb(52 62 48 / 8%);
      font-family: "DM Sans", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; }
    button, input, select { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #e59a32; outline-offset: 3px; }
    .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; padding: 27px 18px 20px; border-right: 1px solid var(--line); background: #fffdf8; }
    .brand { display: flex; align-items: center; gap: 11px; margin: 0 0 42px 7px; color: var(--ink); text-decoration: none; }
    .brand-mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 13px; background: var(--green); color: white; font-size: 22px; }
    .brand-name { font: 700 21px "Fraunces", Georgia, serif; }
    .nav-label { margin: 0 0 9px 11px; color: #949a91; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; max-height: 60vh; overflow-y: auto; }
    .nav-button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 9px; background: transparent; color: #68746d; text-align: left; cursor: pointer; }
    .nav-button:hover { background: #f5f2e9; }
    .nav-button[aria-current="page"] { background: var(--green-light); color: var(--green); font-weight: 700; }
    .nav-icon { display: grid; width: 22px; place-items: center; font-size: 17px; }
    .sidebar-spacer { flex: 1; min-height: 30px; }
    .level-box { padding: 15px; border: 1px solid #e9e3d8; border-radius: 10px; background: #fffaf0; }
    .level-top { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; font-weight: 700; }
    .level-top span:last-child { color: var(--muted); font-size: 11px; }
    .level-track, .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: #e8e7dc; }
    .level-fill, .progress-fill { height: 100%; border-radius: inherit; background: var(--tomato); transition: width 250ms ease; }
    .level-caption { margin: 9px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .sidebar-foot { margin: 17px 0 0 5px; color: #9a9f97; font-size: 11px; }
    .main { min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 78px; padding: 0 42px; border-bottom: 1px solid var(--line); background: rgb(255 254 250 / 75%); }
    .crumb { color: var(--muted); font-size: 13px; }
    .topbar-right { display: flex; align-items: center; gap: 19px; }
    .star-count { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; }
    .star-icon { color: #d7a429; font-size: 18px; }
    .avatar { display: grid; width: 35px; height: 35px; place-items: center; border: 2px solid white; border-radius: 50%; background: #f4d8c6; box-shadow: 0 0 0 1px var(--line); font-size: 18px; }
    .content { width: min(1120px, 100%); margin: 0 auto; padding: 35px 42px 56px; }
    .eyebrow { margin: 0 0 8px; color: var(--tomato); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    h1, h2, h3 { margin-top: 0; font-family: "Fraunces", Georgia, serif; }
    h1 { margin-bottom: 8px; font-size: clamp(30px, 4vw, 42px); line-height: 1.1; }
    .intro { margin-bottom: 27px; color: var(--muted); font-size: 14px; }
    .feature { display: grid; grid-template-columns: 1.05fr .95fr; min-height: 290px; overflow: hidden; border-radius: 12px; background: #245c48; box-shadow: var(--shadow); color: white; }
    .feature-copy { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 34px 38px; }
    .feature .eyebrow { color: #f2d074; }
    .feature h2 { max-width: 390px; margin: 0 0 10px; font-size: clamp(28px, 3vw, 37px); line-height: 1.09; }
    .feature-copy > p:not(.eyebrow) { max-width: 350px; margin: 0 0 20px; color: #deebe2; font-size: 13px; line-height: 1.65; }
    .feature-meta { display: flex; flex-wrap: wrap; gap: 15px; margin: 0 0 23px; color: #e8efe7; font-size: 12px; }
    .primary-button, .secondary-button { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 17px; border: 0; border-radius: 7px; font-size: 13px; font-weight: 800; cursor: pointer; transition: transform 150ms ease, background 150ms ease; }
    .primary-button { background: var(--yellow); color: #263b30; }
    .primary-button:hover { transform: translateY(-1px); background: #ffda70; }
    .secondary-button { border: 1px solid var(--line); background: var(--white); }
    .secondary-button:hover { background: #f5f2e9; }
    .feature-photo { min-height: 290px; background-position: center; background-size: cover; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; margin: 33px 0 15px; }
    .section-heading h2 { margin: 0; font-size: 23px; }
    .text-button { padding: 4px 0; border: 0; background: transparent; color: var(--green); font-size: 12px; font-weight: 800; cursor: pointer; }
    .recipe-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .recipe-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--white); transition: transform 150ms ease, box-shadow 150ms ease; }
    .recipe-card:not(.locked):hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .recipe-card-photo { position: relative; height: 128px; background-position: center; background-size: cover; }
    .recipe-card-photo::after { position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgb(29 38 31 / 26%)); content: ""; }
    .recipe-card-body { padding: 13px 14px 15px; }
    .recipe-card h3 { margin: 0 0 5px; font-size: 16px; }
    .recipe-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .card-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; color: #68746d; font-size: 10px; font-weight: 700; }
    .locked { filter: saturate(.58); }
    .screen-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .screen-heading h1 { margin-bottom: 5px; }
    .screen-heading p:not(.eyebrow) { margin: 0; color: var(--muted); font-size: 13px; }
    .book-tools { display: grid; grid-template-columns: minmax(190px, 1fr) 190px 190px; gap: 10px; margin-bottom: 19px; }
    .search-wrap { position: relative; }
    .search-wrap span { position: absolute; top: 10px; left: 12px; color: var(--muted); }
    .book-tools input, .book-tools select { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--white); font-size: 12px; }
    .book-tools input { padding-left: 35px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
    .filter-button { min-height: 31px; padding: 0 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--white); color: #657067; font-size: 11px; font-weight: 700; cursor: pointer; }
    .filter-button[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: white; }
    .result-count { margin: 0 0 12px; color: var(--muted); font-size: 11px; }
    .book-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .book-card { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
    .book-card .recipe-card-photo { height: 120px; }
    .book-card-body { padding: 13px; }
    .book-card h2 { min-height: 38px; margin: 0 0 5px; font-size: 16px; line-height: 1.2; }
    .book-card p { min-height: 18px; margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .book-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .book-footer span { color: #657067; font-size: 10px; font-weight: 700; }
    .book-footer .primary-button, .book-footer .secondary-button { min-height: 31px; padding: 0 9px; font-size: 10px; }
    .book-footer .locked-label { color: #956c0f; }
    .recipe-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 11px; }
    .favorite-button { display: inline-flex; align-items: center; gap: 6px; min-height: 31px; padding: 0 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--white); color: #68746d; font-size: 11px; font-weight: 700; cursor: pointer; }
    .favorite-button[aria-pressed="true"] { border-color: #e8c86d; background: #fff7dc; color: #80621a; }
    .recipe-notes { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
    .recipe-notes summary { color: var(--green); font-size: 11px; font-weight: 700; cursor: pointer; }
    .recipe-notes textarea { width: 100%; min-height: 66px; margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; font: inherit; font-size: 11px; }
    .recipe-notes select { width: 100%; height: 33px; margin-top: 7px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: white; font-size: 11px; }
    .create-recipe-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; max-width: 760px; }
    .create-recipe-form .field-label { font-size: 12px; }
    .create-recipe-form textarea { min-height: 95px; padding: 10px; border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: 13px; }
    .create-recipe-form .wide { grid-column: 1 / -1; }
    .no-results { grid-column: 1 / -1; padding: 45px 20px; border: 1px dashed var(--line); border-radius: 9px; color: var(--muted); text-align: center; font-size: 13px; }
    .settings-section { margin-bottom: 29px; }
    .settings-section h2 { margin: 0 0 6px; font-size: 21px; }
    .settings-section > p { margin: 0 0 17px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .profile-form { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(150px, .7fr) auto; align-items: end; gap: 12px; padding: 18px 0 22px; border-bottom: 1px solid var(--line); }
    .field-label { display: grid; gap: 7px; color: #59665e; font-size: 11px; font-weight: 700; }
    .field-label input, .field-label select { width: 100%; height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--white); font-size: 13px; }
    .settings-list { border-top: 1px solid var(--line); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 72px; border-bottom: 1px solid var(--line); }
    .setting-copy strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .setting-copy span { display: block; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .switch { position: relative; display: inline-flex; flex: 0 0 44px; height: 25px; cursor: pointer; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .switch-track { width: 44px; height: 25px; border-radius: 99px; background: #d5d9d3; transition: background 150ms ease; }
    .switch-track::after { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: white; box-shadow: 0 1px 3px #0002; content: ""; transition: transform 150ms ease; }
    .switch input:checked + .switch-track { background: var(--green); }
    .switch input:checked + .switch-track::after { transform: translateX(19px); }
    .switch input:focus-visible + .switch-track { outline: 3px solid #e59a32; outline-offset: 3px; }
    .danger-zone { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 14px; }
    .danger-zone p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .danger-button { min-height: 38px; padding: 0 13px; border: 1px solid #e6aaa0; border-radius: 7px; background: #fffefa; color: #a33e32; font-size: 11px; font-weight: 800; cursor: pointer; }
    .danger-button:hover { background: #fff0ec; }
    html.large-text .content :is(p, .setting-copy strong, .setting-copy span, .cook-prompt, .cook-feedback, .choice-text, .ingredient-name, .learn-panel > p, .recipe-fact, .screen-heading p, .intro, .recipe-card p, .book-card p) { font-size: 1.12em; }
    html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    html.no-tips .learn-panel { display: none; }
    html.no-tips .cook-layout { grid-template-columns: minmax(0, 1fr); }
    .cook-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(235px, .75fr); align-items: start; gap: 19px; }
    .cook-panel, .learn-panel { border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
    .cook-panel { overflow: hidden; }
    .cook-image { height: 170px; background-position: center 53%; background-size: cover; }
    .cook-body { padding: 23px 25px 25px; }
    .stage-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .stage-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .stage-dots { display: flex; gap: 5px; }
    .stage-dot { width: 20px; height: 5px; border-radius: 20px; background: #e6e5db; }
    .stage-dot.done { background: var(--green); }
    .stage-dot.current { background: var(--tomato); }
    .cook-body h2 { margin: 0 0 7px; font-size: 23px; }
    .cook-prompt { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .ingredient-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .ingredient-button { min-height: 82px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fffefa; cursor: pointer; }
    .ingredient-button:hover:not(:disabled) { border-color: #9dbea4; background: #f4f8f1; }
    .ingredient-button:disabled { cursor: default; opacity: .58; }
    .ingredient-button.selected { border-color: #77a486; background: var(--green-light); }
    .ingredient-emoji { display: block; margin-bottom: 6px; font-size: 23px; }
    .ingredient-name { display: block; font-size: 11px; font-weight: 700; }
    .cook-feedback { min-height: 38px; margin: 12px 0 2px; color: var(--green); font-size: 12px; line-height: 1.5; }
    .step-number { display: inline-grid; width: 25px; height: 25px; margin-right: 6px; place-items: center; border-radius: 50%; background: #fff1d2; color: #80621a; font-size: 11px; font-weight: 800; vertical-align: middle; }
    .choice-list { display: grid; gap: 9px; }
    .choice-button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); text-align: left; cursor: pointer; }
    .choice-button:hover:not(:disabled) { border-color: #9dbea4; background: #f4f8f1; }
    .choice-button:disabled { cursor: default; }
    .choice-button.correct { border-color: #8eb29b; background: var(--green-light); }
    .choice-button.incorrect { border-color: #e6aaa0; background: #fff0ec; }
    .choice-letter { display: grid; flex: 0 0 27px; height: 27px; place-items: center; border-radius: 50%; background: #f4f1e9; color: #657067; font-size: 11px; font-weight: 800; }
    .choice-text { font-size: 12px; line-height: 1.45; }
    .action-row { display: flex; justify-content: flex-end; margin-top: 15px; }
    .learn-panel { padding: 20px; }
    .learn-top { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .learn-icon { display: grid; width: 37px; height: 37px; place-items: center; border-radius: 10px; background: #fff1d2; font-size: 18px; }
    .learn-top h3 { margin: 0; font-size: 16px; }
    .learn-panel > p { margin: 0; color: #657067; font-size: 12px; line-height: 1.7; }
    .learn-divider { height: 1px; margin: 17px 0; background: var(--line); }
    .recipe-facts { display: grid; gap: 12px; }
    .recipe-fact { display: flex; justify-content: space-between; gap: 12px; color: #657067; font-size: 11px; }
    .recipe-fact strong { color: var(--ink); text-align: right; }
    .safety-note { margin-top: 15px; padding: 11px; border-radius: 7px; background: #fff5df; color: #725d31; font-size: 10px; line-height: 1.55; }
    .celebration { padding: 13px 0 6px; text-align: center; }
    .celebration-icon { display: inline-grid; width: 64px; height: 64px; margin-bottom: 12px; place-items: center; border-radius: 50%; background: #fff1d2; font-size: 30px; }
    .celebration h2 { margin: 0 0 8px; font-size: 28px; }
    .celebration p { max-width: 350px; margin: 0 auto 17px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .reward { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 20px; color: #956c0f; font-size: 14px; font-weight: 800; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 5; max-width: min(350px, calc(100vw - 32px)); padding: 13px 16px; border-radius: 8px; background: #263b30; box-shadow: var(--shadow); color: white; font-size: 12px; line-height: 1.5; animation: appear 180ms ease-out; }
    .primary-button:disabled, .secondary-button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .action-row.split { justify-content: space-between; }
    .check-list, .sheet-ingredients, .sheet-steps { margin: 0; padding: 0; list-style: none; }
    .check-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--white); cursor: pointer; }
    .check-item.checked { border-color: #8eb29b; background: var(--green-light); }
    .check-item.checked .check-name { text-decoration: line-through; color: var(--muted); }
    .check-item input { width: 18px; height: 18px; accent-color: var(--green); }
    .check-amount { min-width: 92px; font-size: 13px; font-weight: 800; color: var(--green); }
    .check-name { font-size: 13px; }
    .cook-progress { margin: 0 0 22px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
    .cook-progress-text { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 9px; font-size: 12px; }
    .cook-progress-text span { color: var(--muted); }
    .cook-progress .progress-track { height: 10px; }
    .step-text { margin: 0 0 22px; font-size: 17px; line-height: 1.65; }
    .recipe-sheet { padding: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
    .recipe-sheet h3 { margin: 0 0 10px; font-size: 16px; }
    .sheet-ingredients { margin-bottom: 20px; }
    .sheet-ingredients li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .sheet-amount { flex: 0 0 96px; font-weight: 800; color: var(--green); }
    .sheet-steps { counter-reset: s; }
    .sheet-steps li { counter-increment: s; position: relative; padding: 0 0 12px 30px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .sheet-steps li::before { content: counter(s); position: absolute; left: 0; top: 0; display: grid; width: 21px; height: 21px; place-items: center; border-radius: 50%; background: #f0ede4; font-size: 10px; font-weight: 800; }
    .sheet-steps li.current { color: var(--ink); font-weight: 600; }
    .sheet-steps li.current::before { background: var(--tomato); color: white; }
    .sheet-steps li.done::before { background: var(--green); color: white; }
    .chef-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 760px; }
    .chef-head { display: flex; align-items: center; gap: 14px; }
    .chef-face { display: grid; width: 64px; height: 64px; place-items: center; border-radius: 50%; background: #fff1d2; font-size: 36px; }
    .chef-note { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .chat-log { display: grid; gap: 12px; max-height: 460px; overflow-y: auto; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
    .bubble { max-width: 88%; padding: 11px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; white-space: pre-line; }
    .bubble.chef { justify-self: start; background: var(--green-light); }
    .bubble.you { justify-self: end; background: #fff1d2; }
    .chat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .chat-card { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
    .chat-card .recipe-card-photo { height: 100px; }
    .chat-card-body { padding: 10px 12px 12px; }
    .chat-card h4 { margin: 0 0 6px; font-family: "Fraunces", Georgia, serif; font-size: 15px; }
    .chat-card ul { margin: 0 0 10px; padding-left: 16px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .chat-card .primary-button { min-height: 32px; width: 100%; font-size: 11px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 7px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--white); font-size: 12px; cursor: pointer; }
    .chip:hover { background: #f5f2e9; }

      const sources = (item) => [...new Set(item.parts.map((part) => part.recipeId === "custom" ? "Added by you" : recipeById(part.recipeId)?.name || "Removed recipe"))].join(", ");
      const pickerOptions = [...recipes].sort((a, b) => Number(state.favorites.includes(b.id)) - Number(state.favorites.includes(a.id)) || a.name.localeCompare(b.name)).map((recipe) => `<option value="${esc(recipe.id)}">${state.favorites.includes(recipe.id) ? "♥ " : ""}${esc(recipe.name)} (${esc(recipe.category)})</option>`).join("");
      app.innerHTML = `<div class="screen-heading"><div><p class="eyebrow">Ready to shop</p><h1>Shopping list</h1><p>${items.length ? `${toBuy} to buy · ${items.length - toBuy} you already have` : "Ingredients from your recipes are combined here."}</p></div></div>
        <section class="settings-section"><h2>Add ingredients</h2><form class="chat-form" id="list-recipe-form"><label class="sr-only" for="list-recipe">Recipe to add</label><select id="list-recipe" class="list-select">${pickerOptions}</select><button class="primary-button" type="submit">Add recipe</button></form><form class="chat-form add-item-form" id="list-item-form"><label class="sr-only" for="list-item-name">Item name</label><input id="list-item-name" maxlength="60" placeholder="Something else, like napkins" required><label class="sr-only" for="list-item-amount">Amount</label><input id="list-item-amount" class="amount-input" maxlength="20" placeholder="Amount (optional)"><button class="secondary-button" type="submit">Add item</button></form></section>
        ${listed.length ? `<section class="settings-section"><h2>Recipes on this list</h2><div class="chip-row">${listed.map((id) => `<span class="chip removable">${esc(recipeById(id)?.name || "Removed recipe")} <button class="chip-x" data-remove-recipe="${esc(id)}" aria-label="Remove ${esc(recipeById(id)?.name || "recipe")} from the list">×</button></span>`).join("")}</div></section>` : ""}
        ${groups.length ? groups.map(([category, list]) => `<section class="shop-group"><h2>${category}</h2><ul class="shop-list">${list.map((item) => `<li class="shop-item ${item.have ? "have" : ""}"><label class="shop-check"><input type="checkbox" data-have="${esc(item.key)}" ${item.have ? "checked" : ""} aria-label="I already have ${esc(item.name)}"><span class="shop-name">${esc(item.name)}</span></label><span class="shop-amount">${esc(amountLabel(item.parts))}</span><span class="shop-from">${esc(sources(item))}</span><button class="chip-x" data-remove-item="${esc(item.key)}" aria-label="Remove ${esc(item.name)}">×</button></li>`).join("")}</ul></section>`).join("") : `<p class="shelf-empty">Your list is empty. Add a recipe above, or tap "+ List" on any recipe card.</p>`}
        ${items.length ? `<div class="danger-zone"><p>Tick "I already have this" to move an item to the bottom of its aisle.</p><span><button class="secondary-button" data-action="clear-have" ${items.some((item) => item.have) ? "" : "disabled"}>Remove items I have</button> <button class="danger-button" data-action="clear-all">Clear list</button></span></div>` : ""}`;
      app.querySelector("#list-recipe-form").addEventListener("submit", (event) => { event.preventDefault(); const recipe = recipeById(app.querySelector("#list-recipe").value); if (recipe && addRecipeToList(recipe)) renderShopping(); });
      app.querySelector("#list-item-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = cleanName(app.querySelector("#list-item-name").value.trim());
        if (!name) return;
        const { qty, unit } = parseAmount(app.querySelector("#list-item-amount").value);
        const key = nameKey(name);
        let item = state.shopping.find((entry) => entry.key === key);
        if (!item) { item = { key, name, parts: [], have: false }; state.shopping.push(item); }
        item.parts.push({ recipeId: "custom", qty, unit });
        saveProgress();
        renderShopping();
        app.querySelector("#list-item-name").focus();
      });
      app.querySelectorAll("[data-have]").forEach((box) => box.addEventListener("change", () => { const item = state.shopping.find((entry) => entry.key === box.dataset.have); if (item) { item.have = box.checked; saveProgress(); renderShopping(); [...app.querySelectorAll("[data-have]")].find((el) => el.dataset.have === box.dataset.have)?.focus(); } }));
      app.querySelectorAll("[data-remove-item]").forEach((button) => button.addEventListener("click", () => { state.shopping = state.shopping.filter((entry) => entry.key !== button.dataset.removeItem); saveProgress(); renderShopping(); }));
      app.querySelectorAll("[data-remove-recipe]").forEach((button) => button.addEventListener("click", () => { removeRecipeFromList(button.dataset.removeRecipe); renderShopping(); }));
      app.querySelector('[data-action="clear-have"]')?.addEventListener("click", () => { state.shopping = state.shopping.filter((entry) => !entry.have); saveProgress(); renderShopping(); });
      app.querySelector('[data-action="clear-all"]')?.addEventListener("click", () => { if (!window.confirm("Clear your whole shopping list?")) return; state.shopping = []; saveProgress(); renderShopping(); });
    }

    // Meal planner.
    const PLAN_SLOTS = [["Breakfast", ["Breakfast"]], ["Lunch", ["Lunch", "Snacks"]], ["Dinner", ["Dinner", "Hard", "Extreme"]], ["Dessert", ["Desserts", "Snacks"]]];
    function renderPlanner() {
      const start = addDays(weekStartKey(), state.weekOffset * 7);
      const days = Array.from({ length: 7 }, (_, index) => addDays(start, index));
      const today = dayKey();
      const plannedId = (key, slot) => (state.plan[key] || {})[slot];
      const planned = days.reduce((sum, key) => sum + PLAN_SLOTS.filter(([slot]) => recipeById(plannedId(key, slot))).length, 0);
      const dayLabel = (key) => dateFromKey(key).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
      const pools = Object.fromEntries(PLAN_SLOTS.map(([slot, categories]) => [slot, recipes.filter((recipe) => categories.includes(recipe.category)).sort((a, b) => Number(state.favorites.includes(b.id)) - Number(state.favorites.includes(a.id)) || a.name.localeCompare(b.name))]));
      const options = (slot, selected) => {
        const extra = selected && !pools[slot].some((recipe) => recipe.id === selected.id) ? [selected] : [];
        return `<option value="">Choose a recipe</option>${[...extra, ...pools[slot]].map((recipe) => `<option value="${esc(recipe.id)}" ${selected && selected.id === recipe.id ? "selected" : ""}>${state.favorites.includes(recipe.id) ? "♥ " : ""}${unlocked(recipe) ? "" : "🔒 "}${esc(recipe.name)}</option>`).join("")}`;
      };
      app.innerHTML = `<div class="screen-heading"><div><p class="eyebrow">Plan ahead</p><h1>Meal planner</h1><p>${planned} of ${days.length * PLAN_SLOTS.length} meals planned · ${esc(dateFromKey(days[0]).toLocaleDateString(undefined, { day: "numeric", month: "short" }))} to ${esc(dateFromKey(days[6]).toLocaleDateString(undefined, { day: "numeric", month: "short" }))}</p></div></div>
        <div class="filter-row"><button class="filter-button" data-week="-1">← Previous week</button><button class="filter-button" data-week="0" aria-pressed="${state.weekOffset === 0}">This week</button><button class="filter-button" data-week="1">Next week →</button><button class="filter-button" data-action="fill">Fill empty meals</button><button class="filter-button" data-action="to-list" ${planned ? "" : "disabled"}>Add week to shopping list</button><button class="filter-button" data-action="clear-week" ${planned ? "" : "disabled"}>Clear week</button></div>
        <div class="plan-grid">${days.map((key) => `<section class="plan-day ${key === today ? "today" : ""}" aria-label="${esc(dayLabel(key))}"><h3>${esc(dayLabel(key))}${key === today ? " · today" : ""}</h3>${PLAN_SLOTS.map(([slot]) => { const recipe = recipeById(plannedId(key, slot)); return `<div class="plan-slot"><label>${slot}<select data-plan="${key}|${slot}" aria-label="${slot} on ${esc(dayLabel(key))}">${options(slot, recipe)}</select></label>${recipe && unlocked(recipe) ? `<button class="text-button" data-cook="${esc(recipe.id)}">Cook this</button>` : recipe ? `<span class="chef-note">Locked until ${recipe.unlock} stars</span>` : ""}</div>`; }).join("")}</section>`).join("")}</div>`;
      app.querySelectorAll("[data-plan]").forEach((select) => select.addEventListener("change", () => {
        const [key, slot] = select.dataset.plan.split("|");
        if (select.value) state.plan[key] = { ...(state.plan[key] || {}), [slot]: select.value };
        else if (state.plan[key]) { delete state.plan[key][slot]; if (!Object.keys(state.plan[key]).length) delete state.plan[key]; }
        saveProgress();
        renderPlanner();
        [...app.querySelectorAll("[data-plan]")].find((el) => el.dataset.plan === select.dataset.plan)?.focus();
      }));
      app.querySelectorAll("[data-week]").forEach((button) => button.addEventListener("click", () => { const step = Number(button.dataset.week); state.weekOffset = step === 0 ? 0 : state.weekOffset + step; renderPlanner(); }));
      app.querySelector('[data-action="fill"]').addEventListener("click", () => {
        const used = new Set(days.flatMap((key) => PLAN_SLOTS.map(([slot]) => plannedId(key, slot)).filter(Boolean)));
        let added = 0;
        for (const key of days) for (const [slot] of PLAN_SLOTS) {
          if (recipeById(plannedId(key, slot))) continue;
          const open = pools[slot].filter(unlocked);
          const fresh = open.filter((recipe) => !used.has(recipe.id));
          const choice = (fresh.length ? fresh : open)[Math.floor(Math.random() * (fresh.length ? fresh : open).length)];
          if (!choice) continue;
          state.plan[key] = { ...(state.plan[key] || {}), [slot]: choice.id };
          used.add(choice.id);
          added++;
        }
        saveProgress();
        renderPlanner();
        notify(added ? `Filled ${added} empty ${added === 1 ? "meal" : "meals"}.` : "Every meal is already planned.");
      });
      app.querySelector('[data-action="to-list"]').addEventListener("click", () => {
        const ids = [...new Set(days.flatMap((key) => PLAN_SLOTS.map(([slot]) => plannedId(key, slot)).filter(Boolean)))];
        const results = ids.map((id) => recipeById(id)).filter(Boolean).map((recipe) => addRecipeToList(recipe, true));
        const added = results.filter(Boolean).length;
        notify(added ? `Added ${added} ${added === 1 ? "recipe" : "recipes"} to your shopping list.` : "Those recipes are already on your shopping list.");
      });
      app.querySelector('[data-action="clear-week"]').addEventListener("click", () => { if (!window.confirm("Clear every meal planned this week?")) return; days.forEach((key) => delete state.plan[key]); saveProgress(); renderPlanner(); });
      bindCookButtons();
    }

    // Explore recipes.
    function dailyRecipe(salt = "feature") {
      const pool = recipes.filter((recipe) => !recipe.personal && recipe.difficulty === "Easy");
      return pool[hashText(`${salt}:${dayKey()}`) % pool.length];
    }
    function matchByIngredients(text) {
      if (!vocabulary) vocabulary = new Set(recipes.flatMap((recipe) => [...recipeWords(recipe)]));
      const wanted = [...new Set(wordsOf(text).filter((word) => vocabulary.has(word)))];
      const ranked = wanted.length ? recipes.filter(unlocked).map((recipe) => ({ recipe, hits: wanted.filter((word) => recipeWords(recipe).has(word)) })).filter((item) => item.hits.length).sort((a, b) => b.hits.length - a.hits.length || ingredientCount(a.recipe) - ingredientCount(b.recipe)).slice(0, 9) : [];
      return { wanted, ranked };
    }
    function renderExplore() {
      const open = recipes.filter(unlocked);
      const today = dayKey();
      const pick = state.exploreSurprise && recipeById(state.exploreSurprise);
      const feature = pick || dailyRecipe();
      const rows = [
        ["Quick bites: 15 minutes or less", open.filter((recipe) => minutesOf(recipe) <= 15)],
        ["Few ingredients: 4 or fewer", open.filter((recipe) => ingredientCount(recipe) <= 4)],
        ["Try something new", seededShuffle(open.filter((recipe) => !state.completed.includes(recipe.id)), today)],
        ["Sweet treats", open.filter((recipe) => recipe.category === "Desserts")],
        ["Ready for a challenge", seededShuffle(recipes.filter((recipe) => recipe.difficulty !== "Easy"), today)]
      ].map(([title, list]) => [title, list.slice(0, 6)]).filter(([, list]) => list.length);
      const query = state.exploreQuery.trim();
      const found = query ? matchByIngredients(query) : null;
      app.innerHTML = `<div class="screen-heading"><div><p class="eyebrow">Find your next dish</p><h1>Explore recipes</h1><p>Discover something new, or cook with what you have.</p></div></div>
        <section class="feature" aria-label="${pick ? "Your surprise recipe" : "Recipe of the day"}"><div class="feature-copy"><p class="eyebrow">${pick ? "Your surprise" : "Recipe of the day"}</p><h2>${esc(feature.name)}</h2><div class="feature-meta"><span>◷ ${esc(feature.time)}</span><span>${esc(feature.category)}</span><span>${ingredientCount(feature)} ingredients</span></div><div class="card-actions"><button class="primary-button" data-cook="${esc(feature.id)}">Cook this&nbsp; →</button><button class="secondary-button" data-list="${esc(feature.id)}">+ List</button><button class="secondary-button" data-action="surprise">🎲 Surprise me</button></div></div><div class="feature-photo" style="${recipeImage(feature)}" role="img" aria-label="${esc(feature.name)}"></div></section>
        <section class="settings-section"><h2>What's in your kitchen?</h2><form class="chat-form" id="explore-form"><label class="sr-only" for="explore-input">Ingredients you have</label><input id="explore-input" maxlength="120" autocomplete="off" placeholder="Try: eggs, banana, cheese" value="${esc(state.exploreQuery)}"><button class="primary-button" type="submit">Find recipes</button>${query ? `<button class="secondary-button" type="button" data-action="clear-search">Clear</button>` : ""}</form></section>
        ${found ? `<section class="settings-section"><h2>${found.ranked.length ? `Recipes you can make with ${esc(found.wanted.join(", "))}` : "No matches"}</h2>${found.ranked.length ? `<div class="recipe-grid">${found.ranked.map((item) => `<div class="match-wrap">${recipeCard(item.recipe)}<p class="chef-note">Uses ${esc(item.hits.join(", "))}</p></div>`).join("")}</div>` : `<p class="shelf-empty">${found.wanted.length ? "None of your unlocked recipes use those ingredients yet." : "I did not recognise any ingredients there. Try words like eggs, banana or cheese."}</p>`}</section>` : ""}
        ${rows.map(([title, list]) => `<section class="settings-section"><h2>${esc(title)}</h2><div class="recipe-grid">${list.map(recipeCard).join("")}</div></section>`).join("")}`;
      app.querySelector("#explore-form").addEventListener("submit", (event) => { event.preventDefault(); state.exploreQuery = app.querySelector("#explore-input").value; renderExplore(); app.querySelector("#explore-input").focus(); });
      app.querySelector('[data-action="clear-search"]')?.addEventListener("click", () => { state.exploreQuery = ""; renderExplore(); });
      app.querySelector('[data-action="surprise"]').addEventListener("click", () => {
        const fresh = open.filter((recipe) => !state.completed.includes(recipe.id) && recipe.id !== feature.id);
        const pool = fresh.length ? fresh : open.filter((recipe) => recipe.id !== feature.id);
        if (pool.length) state.exploreSurprise = pool[Math.floor(Math.random() * pool.length)].id;
        renderExplore();
      });
      bindHearts(renderExplore);
      bindCookButtons();
      bindListButtons();
    }

    // Cooking academy.
    function renderAcademy() {
      const lesson = state.academy && LESSONS.find((item) => item.id === state.academy.id);
      if (lesson) { renderLesson(lesson); return; }
      const done = state.lessons.filter((id) => LESSONS.some((item) => item.id === id)).length;
      app.innerHTML = `<div class="screen-heading"><div><p class="eyebrow">Learn the basics</p><h1>Cooking academy</h1><p>${done} of ${LESSONS.length} lessons complete. Pass each short quiz to earn a star.</p></div></div>
        <div class="progress-track" role="progressbar" aria-label="Lessons complete" aria-valuemin="0" aria-valuemax="${LESSONS.length}" aria-valuenow="${done}"><div class="progress-fill" style="width:${Math.round(done / LESSONS.length * 100)}%"></div></div>
        <div class="lesson-grid">${LESSONS.map((item) => { const complete = state.lessons.includes(item.id); return `<article class="lesson-card ${complete ? "complete" : ""}"><div class="lesson-icon" aria-hidden="true">${item.icon}</div><h2>${esc(item.title)}</h2><p>${item.points.length} tips · ${item.quiz.length} question quiz · ${item.minutes} min</p><button class="${complete ? "secondary-button" : "primary-button"}" data-lesson="${item.id}">${complete ? "✓ Review lesson" : "Start lesson"}</button></article>`; }).join("")}</div>`;
      app.querySelectorAll("[data-lesson]").forEach((button) => button.addEventListener("click", () => { state.academy = { id: button.dataset.lesson, view: "learn", q: 0, correct: 0, picked: null, reward: false }; renderAcademy(); }));
    }
    function renderLesson(lesson) {
      const session = state.academy;
      const back = `<button class="secondary-button" data-action="lessons">←&nbsp; All lessons</button>`;
      if (session.view === "learn") {
        app.innerHTML = `<div class="screen-heading"><div><p class="eyebrow">Lesson</p><h1>${lesson.icon} ${esc(lesson.title)}</h1><p>${esc(lesson.intro)}</p></div>${back}</div><section class="settings-section"><h2>What to remember</h2><ol class="lesson-points">${lesson.points.map((point) => `<li>${esc(point)}</li>`).join("")}</ol><button class="primary-button" data-action="quiz">Take the quiz&nbsp; →</button></section>`;
        app.querySelector('[data-action="quiz"]').addEventListener("click", () => { session.view = "quiz"; renderAcademy(); });
      } else if (session.view === "quiz") {
        const [question, answers, correct, why] = lesson.quiz[session.q];
        const answered = session.picked !== null;
        app.innerHTML = `<div class="screen-heading"><div><p class="eyebrow">Question ${session.q + 1} of ${lesson.quiz.length}</p><h1>${esc(lesson.title)}</h1></div>${back}</div><section class="settings-section"><h2>${esc(question)}</h2><div class="choice-list">${answers.map((answer, index) => `<button class="choice-button ${answered && index === correct ? "correct" : ""} ${answered && index === session.picked && index !== correct ? "incorrect" : ""}" data-answer="${index}" ${answered ? "disabled" : ""}><span class="choice-letter">${String.fromCharCode(65 + index)}</span><span class="choice-text">${esc(answer)}</span></button>`).join("")}</div>${answered ? `<p class="cook-feedback" role="status">${session.picked === correct ? "Correct! " : "Not quite. "}${esc(why)}</p><div class="action-row"><button class="primary-button" data-action="next-question">${session.q === lesson.quiz.length - 1 ? "See my result" : "Next question"}&nbsp; →</button></div>` : ""}</section>`;
        app.querySelectorAll("[data-answer]").forEach((button) => button.addEventListener("click", () => {
          if (session.picked !== null) return;
          session.picked = Number(button.dataset.answer);
          if (session.picked === correct) session.correct++;
          renderAcademy();
        }));
        app.querySelector('[data-action="next-question"]')?.addEventListener("click", () => {
          if (session.q < lesson.quiz.length - 1) { session.q++; session.picked = null; }
          else {
            session.view = "result";
            if (session.correct >= 2 && !state.lessons.includes(lesson.id)) { state.lessons.push(lesson.id); state.stars += 1; session.reward = true; saveProgress(); }
          }
          renderAcademy();
        });
      } else {
        const passed = session.correct >= 2;
        app.innerHTML = `<div class="screen-heading"><div><p class="eyebrow">Quiz result</p><h1>${passed ? "Lesson complete!" : "Nearly there"}</h1><p>You got ${session.correct} of ${lesson.quiz.length} right.</p></div>${back}</div><section class="settings-section">${passed ? `<p class="reward">${session.reward ? "★ +1 star earned" : "Lesson already completed"}</p>` : `<p>Get at least 2 right to pass. Read the tips again and have another go.</p>`}<div class="action-row"><button class="secondary-button" data-action="retry">${passed ? "Review the lesson" : "Read the tips again"}</button></div></section>`;
        app.querySelector('[data-action="retry"]').addEventListener("click", () => { state.academy = { id: lesson.id, view: "learn", q: 0, correct: 0, picked: null, reward: false }; renderAcademy(); });
      }
      app.querySelector('[data-action="lessons"]').addEventListener("click", () => { state.academy = null; renderAcademy(); });
    }

    // Challenges and weekly goals.
    const MYSTERY_INGREDIENTS = ["banana", "egg", "cheese", "tomato", "strawberry", "bread", "milk", "chicken", "butter", "yogurt", "rice", "potato", "apple", "lemon", "onion", "pasta"];
    function usesIngredient(recipe, word) { return buildRecipeDetails(recipe).ingredients.some((item) => wordsOf(item.name).includes(word)); }
    function mysteryIngredient(date) {
      const pool = MYSTERY_INGREDIENTS.filter((word) => recipes.filter((recipe) => !recipe.personal && recipe.difficulty === "Easy" && usesIngredient(recipe, word)).length >= 2);
      return pool[hashText(`mystery:${date}`) % pool.length];
    }
    function dailyChallenges() {
      const today = dayKey();
      const featured = dailyRecipe("daily");
      const mystery = mysteryIngredient(today);
      const cookedToday = state.cookedLog.filter((entry) => entry.date === today).map((entry) => recipeById(entry.id)).filter(Boolean);
      const easy = recipes.filter((recipe) => !recipe.personal);
      return [
        { id: "daily", icon: "🍳", title: `Cook ${featured.name}`, text: "Today's featured dish.", reward: 2, done: cookedToday.some((recipe) => recipe.id === featured.id), recipes: [featured] },
        { id: "mystery", icon: "❓", title: state.challenges.revealed[today] ? `Mystery ingredient: ${mystery}` : "Mystery ingredient", text: state.challenges.revealed[today] ? `Cook any recipe that uses ${mystery}.` : "Reveal today's ingredient, then cook a recipe that uses it.", reward: 2, done: cookedToday.some((recipe) => usesIngredient(recipe, mystery)), mystery, recipes: state.challenges.revealed[today] ? easy.filter((recipe) => unlocked(recipe) && usesIngredient(recipe, mystery)).slice(0, 3) : [] },
        { id: "three", icon: "3️⃣", title: "3-ingredient challenge", text: "Cook any recipe with 3 ingredients or fewer.", reward: 2, done: cookedToday.some((recipe) => ingredientCount(recipe) <= 3), recipes: seededShuffle(easy.filter((recipe) => unlocked(recipe) && ingredientCount(recipe) <= 3), today).slice(0, 3) }
      ];
    }
    const WEEKLY_GOALS = [
      { id: "cook5", title: "Cook 5 recipes", target: 5, reward: 3, measure: (log) => log.length },
      { id: "days3", title: "Cook on 3 different days", target: 3, reward: 3, measure: (log) => new Set(log.map((entry) => entry.date)).size },
      { id: "cats3", title: "Cook from 3 different categories", target: 3, reward: 3, measure: (log) => new Set(log.map((entry) => recipeById(entry.id)?.category).filter(Boolean)).size },
      { id: "new2", title: "Try 2 recipes for the first time", target: 2, reward: 3, measure: (log) => log.filter((entry) => entry.first).length }
    ];
    function claimReward(key, reward) {
      if (state.challenges.claimed[key]) return;
      state.challenges.claimed[key] = true;
      state.stars += reward;
      saveProgress();
      renderChallenges();
      notify(`★ +${reward} stars claimed!`);
    }
    function renderChallenges() {
      const today = dayKey();
      const week = weekStartKey();
      const weekEntries = state.cookedLog.filter((entry) => entry.date >= week && entry.date <= addDays(week, 6));
      const daily = dailyChallenges();

    function resizeImage(file, max = 560) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          const scale = Math.min(1, max / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          const context = canvas.getContext("2d");
          URL.revokeObjectURL(url);
          if (!context) { reject(new Error("Canvas is not available")); return; }
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        image.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file is not a readable image")); };
        image.src = url;
      });
    }

      { match: /fluffy|pancake tips/, title: "Fluffy pancakes", recipe: "Pancakes", steps: ["Whisk the dry ingredients first so the baking powder is spread evenly.", "Stir wet into dry just until combined. Small lumps are fine; overmixing makes pancakes tough.", "Rest the batter for 5 minutes so the flour absorbs the liquid.", "Cook on medium heat, not high. Flip once, when bubbles form and the edges look set.", "Do not press the pancake after flipping; that squashes out the air."] },
      { match: /chop|dice|knife/, title: "Chopping safely", steps: ["Ask a grown-up to supervise. A sharp knife slips less than a dull one.", "Put a damp towel under the cutting board so it cannot slide.", "Slice a thin piece off round foods to make a flat side, then lay it flat.", "Curl your guiding hand into a claw: fingertips tucked back, knuckles against the knife.", "Cut slowly and keep the tip of the knife on the board."] },
      { match: /(boil|cook).*(pasta|noodle)/, title: "Cooking pasta", recipe: "Spaghetti", steps: ["Use a big pot with plenty of water so the pasta can move around.", "Once the water boils, add a generous pinch of salt, then the pasta. A grown-up should handle the hot pot.", "Stir in the first minute so it does not stick.", "Taste a piece 1–2 minutes before the package time; it should be tender with a slight bite.", "Scoop out a cup of pasta water before draining; a splash helps sauce cling."] },
      { match: /whisk/, title: "Whisking", steps: ["Use a bowl big enough that nothing splashes out.", "Hold the bowl steady with a damp towel underneath.", "Move the whisk in quick circles, lifting a little to add air.", "Stop when the mixture looks even, with no streaks."] },
      { match: /\bfold(ing)?\b/, title: "Folding", steps: ["Use a rubber spatula and add the lighter mixture on top of the heavier one.", "Cut down through the middle to the bottom of the bowl.", "Sweep along the bottom and lift up and over the top.", "Turn the bowl a quarter turn and repeat just until no streaks remain. Gentle folding keeps the air in."] },
      { match: /simmer/, title: "Simmering", steps: ["Bring the liquid to a boil first.", "Lower the heat until only small bubbles rise gently to the surface.", "Keep the pot partly covered if the recipe says so, and stir now and then.", "If it boils hard again, turn the heat down."] },
      { match: /saut/, title: "Sautéing", steps: ["Heat the pan on medium before adding a little oil.", "Cut the food into similar-sized pieces so it cooks evenly.", "Add the food in a single layer; too much at once steams it instead of browning.", "Stir or toss now and then until tender and lightly browned. A grown-up should handle the stove."] },
      { match: /melt.*chocolate|chocolate.*melt/, title: "Melting chocolate", steps: ["Chop the chocolate into small, even pieces.", "Heat in short 20–30 second bursts in the microwave, or in a bowl over barely simmering water, with a grown-up's help.", "Stir between bursts; chocolate keeps its shape until stirred.", "Stop when a few lumps remain and stir until smooth. Keep water away from the chocolate."] },
      { match: /knead|dough/, title: "Kneading dough", steps: ["Dust the counter lightly with flour.", "Push the dough away from you with the heel of your hand.", "Fold it back over itself and give it a quarter turn.", "Repeat for about 8 minutes, until smooth and springy. Add flour only a pinch at a time."] }
    ];
    const vagueWords = new Set(["fresh", "cooked", "large", "small", "ripe", "optional", "ground", "plain", "whole", "sweet", "chopped", "sliced", "frozen", "mixed", "ready", "made", "can", "with", "make", "use", "the", "and", "for", "what", "how", "have", "want", "need", "some", "from", "using", "you", "any", "got", "cook", "something", "instead", "kind"]);
    let vocabulary = null;
    let chatLog = null;
    function stem(word) { return word.replace(/oes$/, "o").replace(/ies$/, "y").replace(/([^s])s$/, "$1"); }
    function wordsOf(text) { return text.toLowerCase().split(/[^a-z]+/).filter((word) => word.length >= 3).map(stem).filter((word) => !vagueWords.has(word)); }
    function recipeWords(recipe) { return new Set([...wordsOf(recipe.name), ...buildRecipeDetails(recipe).ingredients.flatMap((item) => wordsOf(item.name))]); }
    function chatCard(recipe) {
      const items = buildRecipeDetails(recipe).ingredients;
      const shown = items.slice(0, 5).map((item) => `<li>${esc(item.amount)} ${esc(item.name)}</li>`).join("");
      const more = items.length > 5 ? `<li>+ ${items.length - 5} more</li>` : "";
      const action = unlocked(recipe) ? `<button class="primary-button" data-chef-cook="${esc(recipe.id)}">Start cooking</button>` : `<p class="chef-note">Locked: earn ${recipe.unlock} stars to cook this.</p>`;
      return `<article class="chat-card">${heartButton(recipe)}<div class="recipe-card-photo" style="${recipeImage(recipe)}" role="img" aria-label="${esc(recipe.name)}"></div><div class="chat-card-body"><h4>${esc(recipe.name)}</h4><ul>${shown}${more}</ul>${action}</div></article>`;
    }
    function findNamedRecipe(query) {
      const named = recipes.filter((recipe) => query.includes(recipe.name.toLowerCase().replace(/^homemade /, "")));
      if (!named.length) return null;
      const longest = Math.max(...named.map((recipe) => recipe.name.length));
      const best = named.filter((recipe) => recipe.name.length === longest);
      return best.find(unlocked) || best[0];
    }
    function chefReply(text) {
      const query = text.toLowerCase().replace(/\band\b/g, "&").replace(/\s+/g, " ");
      const named = findNamedRecipe(query);
      if (/cook .*(together|with me)|guide me|walk me through|let'?s cook|start cooking/.test(query)) {
        const target = named || recipes.find((recipe) => recipe.id === state.recipeId);
        if (!target) return { text: "Tell me which recipe to cook, like \"Cook pancakes with me\".", cards: [] };
        return { text: unlocked(target) ? `Great choice! Press Start cooking and I'll walk you through ${target.name}: first the ingredients and amounts, then each step one at a time.` : `${target.name} is still locked. Cook easier recipes to earn ${target.unlock} stars first.`, cards: [target.id] };
      }
      if (/instead of|substitut|replace|swap|out of|without|(don'?t|do not) have|no more/.test(query)) {
        const hit = substitutions.find(([pattern]) => pattern.test(query));
        if (hit) return { text: hit[1], cards: [] };
        return { text: "I know swaps for butter, eggs, milk, buttermilk, sugar, honey, flour, baking powder, yogurt, cream, vanilla, lemon, oil, breadcrumbs, beef and chicken. Which one do you need?", cards: [] };
      }
      const technique = techniques.find((item) => item.match.test(query));
      if (technique) {
        const recipe = technique.recipe ? recipes.find((item) => item.name === technique.recipe) : null;
        return { text: `${technique.title}, step by step:\n${technique.steps.map((step, index) => `${index + 1}. ${step}`).join("\n")}`, cards: recipe ? [recipe.id] : [] };
      }
      if (/surprise|random|something new|what should i (make|cook)|dealer/.test(query)) {
        const open = recipes.filter(unlocked);
        const fresh = open.filter((recipe) => !state.completed.includes(recipe.id));
        const pool = fresh.length ? fresh : open;
        const pick = pool[Math.floor(Math.random() * pool.length)];
        return { text: `How about ${pick.name}? It takes about ${pick.time}.`, cards: [pick.id] };
      }
      if (named) {
        const details = buildRecipeDetails(named);
        return { text: `Here is ${named.name}. It takes about ${named.time} and needs ${details.ingredients.length} ingredients. Start cooking and I will show every amount and each of the ${details.steps.length} steps.`, cards: [named.id] };
      }
      if (!vocabulary) vocabulary = new Set(recipes.flatMap((recipe) => [...recipeWords(recipe)]));
      const wanted = [...new Set(wordsOf(query).filter((word) => vocabulary.has(word)))];
      if (wanted.length) {
        const ranked = recipes.filter(unlocked).map((recipe) => { const words = recipeWords(recipe); return { recipe, hits: wanted.filter((word) => words.has(word)).length }; }).filter((item) => item.hits).sort((a, b) => b.hits - a.hits || buildRecipeDetails(a.recipe).ingredients.length - buildRecipeDetails(b.recipe).ingredients.length).slice(0, 3);
        if (ranked.length) return { text: `With ${wanted.join(" and ")} you could make:`, cards: ranked.map((item) => item.recipe.id) };
        return { text: `I could not find an unlocked recipe that uses ${wanted.join(" or ")}. Try other ingredients or ask for a surprise.`, cards: [] };
      }
      return { text: "I can find recipes from ingredients, suggest a surprise, explain a technique, or suggest an ingredient swap. Try one of the questions below.", cards: [] };
    }
    function askChef(text) {
      const question = text.trim();
      if (!question) return;
      chatLog.push({ from: "you", text: question });
      const reply = chefReply(question);
      chatLog.push({ from: "chef", text: reply.text, cards: reply.cards });
      renderChef();
      const log = app.querySelector("#chat-log");
      log.scrollTop = log.scrollHeight;
      app.querySelector("#chat-input").focus();
    }
    function renderChef() {
      if (!chatLog) chatLog = [{ from: "chef", text: "Hi, I'm Chef Ladle! Ask me what to make, how to cook something, or what to use instead of an ingredient." }];
      const suggestions = ["What can I make with strawberries and bananas?", "How do I make fluffy pancakes?", "What can I use instead of butter?", "Teach me to chop safely", "Surprise me!", "Cook pancakes with me"];
      const messages = chatLog.map((message) => `<div class="bubble ${message.from}">${esc(message.text)}</div>${message.cards && message.cards.length ? `<div class="chat-cards">${message.cards.map((id) => recipes.find((recipe) => recipe.id === id)).filter(Boolean).map(chatCard).join("")}</div>` : ""}`).join("");
      app.innerHTML = `<div class="screen-heading"><div><p class="eyebrow">Your cooking buddy</p><h1>Chef AI</h1><p>Ask for recipes, swaps, and cooking help.</p></div></div><div class="chef-wrap"><div class="chef-head"><div class="chef-face" aria-hidden="true">👩‍🍳</div><div><strong>Chef Ladle</strong><p class="chef-note">Answers come from Little Ladle's own recipes and tips, not a live AI model.</p></div></div><div class="chat-log" id="chat-log" role="log" aria-live="polite">${messages}</div><div class="chip-row">${suggestions.map((question) => `<button class="chip" data-ask="${esc(question)}">${esc(question)}</button>`).join("")}</div><form class="chat-form" id="chat-form"><label class="sr-only" for="chat-input">Ask Chef Ladle</label><input id="chat-input" autocomplete="off" maxlength="200" placeholder="Ask about recipes, swaps, or techniques"><button class="primary-button" type="submit">Send</button></form></div>`;
      app.querySelectorAll("[data-ask]").forEach((chip) => chip.addEventListener("click", () => askChef(chip.dataset.ask)));
      bindHearts(() => { const top = app.querySelector("#chat-log").scrollTop; renderChef(); app.querySelector("#chat-log").scrollTop = top; });
      app.querySelectorAll("[data-chef-cook]").forEach((button) => button.addEventListener("click", () => startRecipe(button.dataset.chefCook)));
      app.querySelector("#chat-form").addEventListener("submit", (event) => { event.preventDefault(); const input = app.querySelector("#chat-input"); const value = input.value; input.value = ""; askChef(value); });
    }
    function startRecipe(id) {
      state.recipeId = id;
      state.screen = "cook";
      state.stage = "ingredients";
      state.picked = [];
      state.step = 0;
      state.answered = false;
      state.feedback = "";
      state.firstTry = true;
      state.rewardGranted = false;
      render();
    }
    function render() {
      document.querySelectorAll(".nav-button").forEach((button) => {
        if (button.dataset.screen === state.screen) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
      document.querySelector("#breadcrumb").innerHTML = state.screen === "profile" ? "Your kitchen <span aria-hidden=\"true\">/</span> My chef profile" : state.screen === "chef" ? "Your kitchen <span aria-hidden=\"true\">/</span> Chef AI" : state.screen === "book" ? "Your kitchen <span aria-hidden=\"true\">/</span> Recipe book" : state.screen === "settings" ? "Your kitchen <span aria-hidden=\"true\">/</span> Settings" : state.screen === "cook" ? "Your kitchen <span aria-hidden=\"true\">/</span> Cooking" : "Your kitchen <span aria-hidden=\"true\">/</span> Today";
      updateProgress();
      applyPreferences();
      if (state.screen === "book") renderBook();
      else if (state.screen === "settings") renderSettings();
      else if (state.screen === "chef") renderChef();
      else if (state.screen === "profile") renderProfile();
      else if (state.screen === "cook") renderCook();
      else renderHome();
    }
    document.querySelectorAll(".nav-button").forEach((button) => button.addEventListener("click", () => { state.screen = button.dataset.screen; render(); }));
    document.querySelector("#streak-chip").addEventListener("click", () => { state.screen = "profile"; render(); });
    render();
  </script>
</body>
</html>
